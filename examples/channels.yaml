# channels.yaml: where alerts are sent.
#
# Each channel has a name you choose (lowercase, digits, - and _) and a type.
# Uncomment the one you want, fill it in, then add its name to `notify`
# in pulse.yaml or on a monitor.
#
# Secrets are never written in this file. Write ${NAME} instead, and set the
# variable NAME in the pulse service environment. `pulse validate` warns you
# if a variable is missing.

channels: {}
# When you add your first channel, delete the {} above and indent it under
# `channels:` like the examples below.

#  ops-email:
#    type: smtp
#    host: smtp.example.com
#    port: 587                         # 587 with starttls is the usual choice
#    tls: starttls                     # starttls, tls or none
#    username: alerts@example.com
#    password: ${PULSE_SMTP_PASSWORD}
#    from: alerts@example.com
#    to: [you@example.com]
#
#  team-telegram:
#    type: telegram
#    bot_token: ${PULSE_TELEGRAM_TOKEN} # from @BotFather
#    chat_id: "-1001234567890"
#    min_severity: critical            # only send critical alerts here
#
#  team-slack:
#    type: slack
#    webhook_url: ${PULSE_SLACK_WEBHOOK}
#
#  my-whatsapp:                        # your own Meta WhatsApp Cloud API account
#    type: whatsapp
#    phone_number_id: "123456789012345"
#    access_token: ${PULSE_WHATSAPP_TOKEN}
#    template: pulse_alert             # an approved message template
#    to: ["+919876543210"]
#
#  anything-else:                      # any tool that accepts a JSON POST
#    type: webhook
#    url: https://hooks.example.com/pulse
#    secret: ${PULSE_WEBHOOK_SECRET}   # optional: signs each request
