name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          commit="$(git rev-parse --short=12 HEAD)"
          # The commit time, not the build time, so the same tag always gives the same binary.
          date="$(git log -1 --format=%cI)"
          pkg="github.com/Aadilkaifi/brynko-pulse/internal/version"
          ldflags="-s -w -X ${pkg}.Version=${version} -X ${pkg}.Commit=${commit} -X ${pkg}.Date=${date}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags "$ldflags" \
              -o "dist/pulse_${version}_${os}_${arch}${ext}" ./cmd/pulse
          done
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          mkdir -p dist/pkg
          for arch in amd64 arm64; do
            cp "dist/pulse_${version}_linux_${arch}" dist/pkg/pulse
            for kind in deb rpm; do
              VERSION="${version#v}" ARCH="$arch" nfpm package --config packaging/nfpm.yaml \
                --packager "$kind" --target "dist/brynko-pulse_${version}_linux_${arch}.${kind}"
            done
          done
          rm -r dist/pkg
          cp install.sh dist/install.sh
          (cd dist && sha256sum pulse_* brynko-pulse_* install.sh > SHA256SUMS)

      # Signing SHA256SUMS is added once the signing tool is chosen.

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # A block, not a plain scalar: the notes contain ": ", which YAML would read as a key.
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --draft --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes \
            --notes "Install on Linux: curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sudo sh. On Windows, run the .exe with pulse install as Administrator. Verify downloads against SHA256SUMS. Guide: https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}/docs"
