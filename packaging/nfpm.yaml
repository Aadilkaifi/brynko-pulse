# Builds the .deb and .rpm packages. The release workflow sets VERSION (no
# leading v) and ARCH (amd64 or arm64) and puts the binary at dist/pkg/pulse.
name: brynko-pulse
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: admin
priority: optional
maintainer: Brynko Technologies <sales@brynko.in>
vendor: Brynko Technologies
homepage: https://github.com/Aadilkaifi/brynko-pulse
license: AGPL-3.0-only
description: |
  Open-source server monitoring and alerts.
  Watches disks, memory, CPU, services, containers, ports, websites, certificates,
  files, logs, commands and heartbeats, and alerts within seconds by email,
  WhatsApp, Telegram, Slack or webhook. Outbound only, no account needed.

contents:
  - src: dist/pkg/pulse
    dst: /usr/bin/pulse
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/doc/brynko-pulse/LICENSE
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
